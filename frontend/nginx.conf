server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── WebSocket proxy (must be before general API proxy) ────────────────────
    # Matches any path containing /ws/ so it handles all WebSocket endpoints
    location ~* /ws/ {
        proxy_pass https://nirbaan.onrender.com;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host nirbaan.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Specific API paths that share prefix with frontend routes ─────────────
    location ~ ^/patient/psychoeducation-chat {
        proxy_pass https://nirbaan.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host nirbaan.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/therapist/ai-chat {
        proxy_pass https://nirbaan.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host nirbaan.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── General backend API proxy ─────────────────────────────────────────────
    location ~ ^/(auth|patients|emergency-personnel|resources|sessions|homeworks|fear-ladders|erp|chat|voice|imaginal-generator|education|api|health|media|signup) {
        proxy_pass https://nirbaan.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host nirbaan.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── React SPA — serve index.html for all client-side routes ──────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
